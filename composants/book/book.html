<div class="book">
    <p class="book-url">{{link}}</p>
    <div class="book-conteneur">
        <a href="{{link}}">
            <img class="couverture" src="{{poster}}" alt="Couverture du livre">
        </a>
        <div>
            <a class="invisible" href="{{link}}"><h2 class="title">{{title}}</h2></a>
            <h3 class="author">{{author}}</h3>
            <hr>
            <div class="infos">
                    <h3 class="info">Catégorie : {{categorie}}</h3>
                    <h3  class="info">Disponibilité : {{state}}</h3>
                    
                        <h3  class="info">Propriétaire : <a class="no-opened" href="/user/{{proprietaire}}">{{proprietaire}}</a>
                        </h3>
                    
                    <h2>Synopsis :</h2>
                    <div>{{synopsis}}</div>
            </div>
        </div>
    </div>
</div>
